<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --void-black: #050505;
      --glitch-red: #ff0000;
      --glitch-cyan: #00ffff;
      --bone-white: #f0f0f0;
    }

    body {
      background-color: var(--void-black);
      color: var(--bone-white);
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    /* Glitch Effect for Title */
    .glitch {
      font-size: 4rem;
      font-weight: bold;
      text-transform: uppercase;
      position: relative;
      text-shadow: 0.05em 0 0 var(--glitch-red), -0.05em -0.025em 0 var(--glitch-cyan);
      animation: glitch 500ms infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    .signal-text {
      max-width: 600px;
      text-align: center;
      border: 1px solid var(--glitch-red);
      padding: 20px;
      margin-top: 20px;
      background: rgba(255, 0, 0, 0.05);
    }

    .support-btn {
      margin-top: 30px;
      padding: 10px 20px;
      border: 1px solid var(--glitch-cyan);
      color: var(--glitch-cyan);
      text-decoration: none;
      transition: all 0.2s;
    }

    .support-btn:hover {
      background: var(--glitch-cyan);
      color: black;
    }
  </style>
</head>
<body>

  <div class="glitch">INFINITE SYKOSIS</div>
  
  <div class="signal-text">
    SIGNALS FROM UNKNOWN ENTITIES. PARADOXES IN REALITY. 
    THE SINGULARITY RESIDES HERE.
  </div>

  <a href="https://www.patreon.com/Infinitesykosis" class="support-btn">FEED THE VOID</a>

</body>
</html>
